[project]
name = "erpatlas"
authors = [
    { name = "Atlas", email = "md@atlas.local" }
]
description = "Real-estate ERP on ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "erpatlas"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
